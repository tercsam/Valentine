<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour ma Valentine</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffe6e6;
            --container-bg: rgba(255, 255, 255, 0.9);
            --text-color: #ff4d6d;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            text-align: center;
            transition: background-color 1.5s ease; /* Transition douce pour le mode nuit */
        }

        /* Étoiles pour le mode nuit */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 2s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 320px;
            transition: all 1s ease;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            color: var(--text-color);
            font-size: 3.5rem;
            margin: 20px 0;
            transition: color 1s ease;
        }

        .gif-container img {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 15px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 15px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-yes {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
            z-index: 9999;
        }

        .btn-no {
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .fullscreen-yes {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            font-size: 5rem !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            border-radius: 0 !important;
            margin: 0 !important;
        }

        .heart {
            position: fixed;
            top: -20px;
            font-size: 20px;
            user-select: none;
            z-index: 1000;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="loveMusic" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/07/Rainy-Day-Background-Music.mp3" type="audio/mpeg">
    </audio>

    <div class="container" id="mainContainer">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIyc3E3Z3BqZ3pnd3BqZ3pnd3BqZ3pnd3BqZ3pnd3BqZ3pnd3BqJmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Please" id="mainImage">
        </div>

        <h1 id="question">Veux-tu être ma Valentine Tania ? 💖</h1>

        <div class="buttons">
            <button class="btn-yes" id="yesBtn" onclick="acceptLove()">Oui</button>
            <button class="btn-no" id="noBtn" onclick="refuseLove()">Non</button>
        </div>
    </div>

    <script>
        let fontSize = 1.2; 
        let paddingVertical = 15;
        let paddingHorizontal = 32;
        let darkness = 0; // Pour gérer le mode nuit
        
        const phrases = [
            "Non",
            "Tu es sûre ?",
            "Ah ouais tu m'aime pas ?",
            "Dis le si tu prefere un autre garcon !",
            "Tu me brises le cœur 💔",
            "Dernière chance ma grande!"
        ];
        
        let phraseIndex = 0;

        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1 + "px";
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + "vh";
            star.style.left = Math.random() * 100 + "vw";
            document.body.appendChild(star);
            
            // Animation d'apparition
            setTimeout(() => { star.style.opacity = 1; }, 100);
        }

        function refuseLove() {
            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');
            const container = document.getElementById('mainContainer');
            const question = document.getElementById('question');

            // 1. Gérer les phrases
            phraseIndex++;
            if (phraseIndex < phrases.length) {
                noBtn.innerText = phrases[phraseIndex];
            } else {
                noBtn.style.display = 'none';
            }

            // 2. Faire grandir le bouton Oui
            fontSize += 1.6; 
            paddingVertical += 15;
            paddingHorizontal += 25;
            yesBtn.style.fontSize = fontSize + "rem";
            yesBtn.style.padding = paddingVertical + "px " + paddingHorizontal + "px";

            // 3. MODE NUIT PROGRESSIF
            darkness += 15; // On augmente l'obscurité
            document.body.style.backgroundColor = `rgb(${255 - darkness*2}, ${230 - darkness*2.5}, ${230 - darkness*2})`;
            
            if (darkness > 40) {
                document.body.style.backgroundColor = "#0a0612"; // Bleu nuit final
                container.style.backgroundColor = "rgba(255, 255, 255, 0.1)";
                container.style.backdropFilter = "blur(10px)";
                question.style.color = "white";
                // On fait apparaître des étoiles
                for(let i=0; i<5; i++) createStar();
            }

            if (fontSize > 8) {
                yesBtn.classList.add('fullscreen-yes');
                yesBtn.innerText = "Tu n'as pas le choix ! ❤️";
                noBtn.style.display = "none";
            }
        }

        function acceptLove() {
            const question = document.getElementById('question');
            const image = document.getElementById('mainImage');
            const btnGroup = document.querySelector('.buttons');
            const yesBtn = document.getElementById('yesBtn');
            const audio = document.getElementById('loveMusic');

            // Lancer la musique
            audio.play().catch(e => console.log("L'audio attend un clic"));

            // Pluie de cœurs
            startHearts();

            // GIF de fin
            image.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbmZid3pnd3BqZ3pnd3BqZ3pnd3BqZ3pnd3BqZ3pnd3BqZ3BqJmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/KztT2c4u8mYYUiMKdJ/giphy.gif"; 
            
            question.innerHTML = "Je t'aime Tania ! 💖🥰<br>Hâte d'être le 14 !";
            question.style.color = "#ff4d6d"; // On repasse en rose pour le message final
            
            btnGroup.classList.add('hidden');
            yesBtn.classList.add('hidden');
            
            // Si on est en mode nuit, on garde un fond sombre étoilé mais très doux
            if (darkness > 40) {
                document.body.style.backgroundColor = "#1a0b1e";
            } else {
                document.body.style.backgroundColor = "#ffccd5";
            }
        }

        function startHearts() {
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = Math.random() > 0.5 ? '❤️' : '💖';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                    heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                    heart.style.color = "#ff4d6d";
                    // Si mode nuit, les coeurs brillent
                    if(darkness > 40) heart.style.textShadow = "0 0 10px #ff4d6d";
                    
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>
